spring.application.name=reassignment-engine
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5434/ziprun_db
spring.datasource.username=ziprun
spring.datasource.password=ziprun123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Routing engine — switchable at runtime via ROUTING_STRATEGY env var
routing.strategy=${ROUTING_STRATEGY:rule}

# LLM gateway (Groq). Model list is account-specific and changes over time —
# verify with GET https://api.groq.com/openai/v1/models if this 404s.
llm.provider=groq
llm.api-key=${LLM_API_KEY:}
llm.model=openai/gpt-oss-20b
llm.base-url=https://api.groq.com
llm.timeout-ms=8000

management.endpoints.web.exposure.include=health,info
